<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0Z24386PQN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-0Z24386PQN');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Your Next Move · NorthReserve Mountain</title>
<meta name="description" content="One mountain. One next move. The single highest-leverage step for your finances right now.">
<meta name="theme-color" content="#0A2A2E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nr-app.css">
  <script src="https://my-portfolio-intelligence.netlify.app/sdk/pi.js" data-pi-project="northreserve" defer></script>
</head>
<body class="nr">
<main class="nr-main"><div class="nr-narrow" id="app"></div></main>
<script src="/nr-config.js"></script>
<script src="/links.js"></script>
<script src="/nr-core.js"></script>
<script src="/nr-ui.js"></script>
<script src="/nr-auth.js"></script>
<script src="/nr-store-supabase.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var m = NR.store.loadMountain();
  if (!m) {
    NR.ui.boot({ active: "nextMove", route: "nextmove_empty" });
    app.innerHTML = '<div class="nr-card pad-lg" style="text-align:center"><div class="nr-empty"><div class="big">◆</div><h1>Your next move needs a mountain</h1><p style="margin:0 auto 18px;max-width:42ch">Take the assessment and we’ll pinpoint the single step that moves you most.</p><a class="nr-btn" href="' + NR.config.routes.assessment + '">Take the assessment</a></div></div>';
    return;
  }
  NR.ui.boot({ active: "nextMove", route: "nextmove" });
  var nm = NR.nextMove.compute(m);
  NR.track("next_move_viewed", { score: m.overall, zone: nm.zone || "overall", tool: nm.tool ? nm.tool.name : null });

  var zoneLabel = nm.zone ? NR.score.zoneName(nm.zone) : "Your whole mountain";
  var distanceStat = nm.zone
    ? '<div class="nr-stat"><div class="l">Now</div><div class="v">' + nm.currentScore + '</div></div>' +
      '<div class="nr-stat"><div class="l">Checkpoint</div><div class="v">' + nm.targetScore + '</div></div>' +
      '<div class="nr-stat"><div class="l">To go</div><div class="v">' + nm.distance + '</div></div>'
    : '<div class="nr-stat"><div class="l">Mountain Score</div><div class="v">' + m.overall + '</div></div>' +
      '<div class="nr-stat"><div class="l">Stage</div><div class="v" style="font-size:15px">' + NR.ui.esc(NR.stage.forScore(m.overall).name) + '</div></div>' +
      '<div class="nr-stat"><div class="l">Focus</div><div class="v" style="font-size:15px">Optimize</div></div>';

  app.innerHTML =
    '<div class="nr-crumbs"><a href="' + NR.config.routes.home + '">Mountain</a> / Next Move</div>' +
    '<div class="nr-eyebrow" style="color:var(--gold)">One mountain. One next move.</div>' +
    '<h1>' + NR.ui.esc(nm.title) + '</h1>' +
    '<div class="nr-nextmove nr-section">' +
      '<div class="nr-eyebrow">Focus reservoir</div>' +
      '<div class="nr-nm-title" style="font-size:19px;margin-top:2px">' + NR.ui.esc(zoneLabel) + '</div>' +
      '<p class="nr-nm-body">' + NR.ui.esc(nm.body) + '</p>' +
      '<div class="nr-nm-grid">' + distanceStat + '</div>' +
      '<p style="margin-top:14px;font-size:13.5px;color:var(--ridge)">' + NR.ui.esc(nm.distanceText) + '</p>' +
    '</div>' +
    '<div class="nr-card nr-section"><h2>Why this matters</h2><p style="margin-top:6px">' + NR.ui.esc(nm.why) + '</p></div>' +
    '<div class="nr-card nr-section"><h2>Your suggested step</h2><ul class="nr-steps"><li>' + NR.ui.esc(nm.step) + '</li>' +
      (nm.tool ? '<li>Run the numbers: <a class="nr-link" href="' + nm.tool.url + '">' + NR.ui.esc(nm.tool.name) + '</a></li>' : "") +
      '<li>Come back and do a <a class="nr-link" href="' + NR.config.routes.checkin + '">monthly check-in</a> to watch this reservoir rise.</li></ul>' +
    (nm.crossGraph ? NR.ui.crossGraph(nm.crossGraph) : "") +
    '</div>' +
    '<div class="nr-callout nr-section"><span class="s">▲</span><p>We only ever show you <b>one</b> next move. Clear this checkpoint, check in, and the mountain picks the next one for you — no 17-item to-do list.</p></div>' +
    '<div class="nr-btn-row"><a class="nr-btn" href="' + NR.config.routes.checkin + '">I made progress — update</a><a class="nr-btn ghost" href="' + NR.config.routes.home + '">Back to my Mountain</a></div>';

  var xg = app.querySelector("[data-xg]");
  if (xg) xg.addEventListener("click", function () { NR.track("cross_graph_route_clicked", { route: xg.getAttribute("data-xg"), zone: nm.zone || "overall" }); });
})();
</script>
</body>
</html>
