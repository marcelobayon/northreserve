<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0Z24386PQN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-0Z24386PQN');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Your Progress · NorthReserve Mountain</title>
<meta name="description" content="Your Mountain Score history, reservoir changes, stages, and milestones. Am I climbing?">
<meta name="theme-color" content="#0A2A2E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nr-app.css">
  <script src="https://my-portfolio-intelligence.netlify.app/sdk/pi.js" data-pi-project="northreserve" defer></script>
</head>
<body class="nr">
<main class="nr-main"><div class="nr-wrap" id="app"></div></main>
<script src="/nr-config.js"></script>
<script src="/links.js"></script>
<script src="/nr-core.js"></script>
<script src="/nr-ui.js"></script>
<script src="/nr-auth.js"></script>
<script src="/nr-store-supabase.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var m = NR.store.loadMountain();
  if (!m) {
    NR.ui.boot({ active: "progress", route: "progress_empty" });
    app.innerHTML = '<div class="nr-card pad-lg" style="text-align:center"><div class="nr-empty"><div class="big">↗</div><h1>Your climb starts with a mountain</h1><p style="margin:0 auto 18px;max-width:42ch">Take the assessment, save your Mountain, then check in monthly to see your climb line.</p><a class="nr-btn" href="' + NR.config.routes.assessment + '">Take the assessment</a></div></div>';
    return;
  }
  NR.ui.boot({ active: "progress", route: "progress" });
  NR.track("progress_viewed", { score: m.overall, stage: NR.stage.forScore(m.overall).key });

  var hist = NR.store.getMountainHistory();
  var member = NR.membership.isMember();
  var gateHist = NR.config.gates.fullHistory && !member;
  var visible = gateHist ? hist.slice(-NR.config.freeHistoryVisible) : hist;
  var hidden = hist.length - visible.length;

  function chart(pts) {
    if (pts.length < 2) {
      var p0 = pts[0], W = 620, H = 180, padX = 30, padT = 20, padB = 34;
      var yOf = function (v) { return (H - padB) - (H - padT - padB) * (Math.max(0, Math.min(100, v)) / 100); };
      var xReal = padX + (W - 2 * padX) * 0.26, xGhost = padX + (W - 2 * padX) * 0.74;
      var yReal = yOf(p0.overall), yGhost = yOf(Math.min(100, p0.overall + 6));
      var st0 = NR.stage.forScore(p0.overall);
      var grid = [0, 50, 100].map(function (v) { return '<line x1="' + padX + '" y1="' + yOf(v).toFixed(1) + '" x2="' + (W - padX) + '" y2="' + yOf(v).toFixed(1) + '" stroke="rgba(255,255,255,.06)"/><text x="' + (padX - 8) + '" y="' + (yOf(v) + 3).toFixed(1) + '" fill="#5F726F" font-size="9" font-family="monospace" text-anchor="end">' + v + '</text>'; }).join("");
      var svg = '<svg class="nr-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Your starting point">' + grid +
        '<line x1="' + xReal.toFixed(1) + '" y1="' + yReal.toFixed(1) + '" x2="' + xGhost.toFixed(1) + '" y2="' + yGhost.toFixed(1) + '" stroke="#F2B441" stroke-width="2" stroke-dasharray="3 5" opacity=".4"/>' +
        '<circle cx="' + xGhost.toFixed(1) + '" cy="' + yGhost.toFixed(1) + '" r="5" fill="none" stroke="#F2B441" stroke-width="2" opacity=".5"/>' +
        '<text x="' + xGhost.toFixed(1) + '" y="' + (H - 12) + '" fill="#8DA09C" font-size="10" font-family="monospace" text-anchor="middle" opacity=".7">next check-in</text>' +
        '<circle cx="' + xReal.toFixed(1) + '" cy="' + yReal.toFixed(1) + '" r="6.5" fill="' + st0.color + '" stroke="#0A2A2E" stroke-width="2"/>' +
        '<text x="' + xReal.toFixed(1) + '" y="' + (yReal - 13).toFixed(1) + '" fill="#F4F6F3" font-size="15" font-family="sans-serif" font-weight="700" text-anchor="middle">' + p0.overall + '</text>' +
        '<text x="' + xReal.toFixed(1) + '" y="' + (H - 12) + '" fill="#8DA09C" font-size="10" font-family="monospace" text-anchor="middle">' + NR.ui.esc(NR.util.fmtMonth(p0.ts)) + '</text>' +
        '</svg>';
      return svg +
        '<div class="nr-callout" style="margin-top:14px"><span class="s">▲</span><p><b class="snow">Base camp set at ' + p0.overall + '.</b> This is your starting point — your climb line draws itself from here. Check in next month to log your first move up the mountain.</p></div>' +
        '<div class="nr-btn-row"><a class="nr-btn sm" href="' + NR.config.routes.checkin + '">Do a check-in</a></div>';
    }
    var W = 620, H = 180, padX = 30, padT = 20, padB = 34, n = pts.length;
    var x = function (i) { return padX + (W - 2 * padX) * (n === 1 ? 0 : i / (n - 1)); };
    var y = function (v) { return (H - padB) - (H - padT - padB) * (Math.max(0, Math.min(100, v)) / 100); };
    var dline = "", darea = "", dots = "", labels = "";
    pts.forEach(function (p, i) {
      dline += (i ? " L" : "M") + x(i).toFixed(1) + " " + y(p.overall).toFixed(1);
      var st = NR.stage.forScore(p.overall);
      dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.overall).toFixed(1) + '" r="' + (i === n - 1 ? 5.5 : 4) + '" fill="' + st.color + '" stroke="#0A2A2E" stroke-width="2"/>';
      if (n <= 7 || i === 0 || i === n - 1) labels += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 12) + '" fill="#8DA09C" font-size="10" font-family="monospace" text-anchor="middle">' + NR.ui.esc(NR.util.fmtMonth(p.ts)) + '</text>';
    });
    darea = "M" + x(0).toFixed(1) + " " + (H - padB) + " L" + dline.slice(1) + " L" + x(n - 1).toFixed(1) + " " + (H - padB) + " Z";
    var last = pts[n - 1];
    var grid = [0, 50, 100].map(function (v) { return '<line x1="' + padX + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - padX) + '" y2="' + y(v).toFixed(1) + '" stroke="rgba(255,255,255,.06)"/><text x="' + (padX - 8) + '" y="' + (y(v) + 3).toFixed(1) + '" fill="#5F726F" font-size="9" font-family="monospace" text-anchor="end">' + v + '</text>'; }).join("");
    return '<svg class="nr-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mountain Score over time">' +
      '<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B441" stop-opacity=".28"/><stop offset="1" stop-color="#F2B441" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + darea + '" fill="url(#ar)"/><path d="' + dline + '" fill="none" stroke="#F2B441" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + labels +
      '<text x="' + x(n - 1).toFixed(1) + '" y="' + (y(last.overall) - 12).toFixed(1) + '" fill="#F4F6F3" font-size="15" font-family="sans-serif" font-weight="700" text-anchor="middle">' + last.overall + '</text>' +
      '</svg>';
  }

  // monthly report: latest vs previous snapshot
  var cur = hist[hist.length - 1], prev = hist.length >= 2 ? hist[hist.length - 2] : null;
  var delta = prev ? (cur.overall - prev.overall) : null;
  var reportBody;
  if (prev) {
    // biggest reservoir improvement
    var bestZone = null, bestGain = -Infinity;
    NR.score.ZONES.forEach(function (z) { var g = (cur.scores[z] || 0) - (prev.scores[z] || 0); if (g > bestGain) { bestGain = g; bestZone = z; } });
    var nm = NR.nextMove.compute(m);
    reportBody =
      '<div class="nr-score" style="margin-bottom:6px">' + NR.ui.ring(cur.overall) +
      '<div class="nr-score-meta">' + NR.ui.stagePill(cur.overall) + '<div style="margin-top:8px">' + NR.ui.deltaBadge(delta) + '</div>' +
      '<p style="margin-top:10px;font-family:var(--mono);font-size:14px;color:var(--ridge)">' + prev.overall + ' → <span class="gold">' + cur.overall + '</span></p></div></div>' +
      (bestGain > 0 ? '<p style="margin-top:10px">Biggest climb: <b class="snow">' + NR.ui.esc(NR.score.zoneName(bestZone)) + '</b> rose ' + bestGain + ' points.</p>' : '<p style="margin-top:10px">Steady month. Your next move is still <b class="snow">' + NR.ui.esc(nm.title) + '</b></p>');
  } else {
    reportBody = '<div class="nr-score">' + NR.ui.ring(cur.overall) + '<div class="nr-score-meta">' + NR.ui.stagePill(cur.overall) +
      '<p style="margin-top:10px">This is your baseline. Check in next month and this becomes "your Mountain moved."</p></div></div>';
  }

  // reservoir changes
  var resChanges = "";
  if (prev) {
    resChanges = '<div class="nr-card nr-section"><h2>Reservoir changes</h2><div class="nr-res" style="margin-top:12px">' +
      ["retirement", "sinking", "emergency", "buffer"].map(function (z) {
        var c = cur.scores[z] || 0, p = prev.scores[z] || 0, g = c - p, cls = g > 0 ? "up" : (g < 0 ? "down" : "flat");
        var arrow = g > 0 ? "↑" : (g < 0 ? "↓" : "→");
        return '<div class="nr-res-row"><div class="top"><span class="nr-res-name">' + NR.ui.esc(NR.score.zoneName(z)) + '</span>' +
          '<span class="chg ' + cls + '" style="font-family:var(--mono);font-size:12px">' + p + ' ' + arrow + ' ' + c + (g ? ' (' + (g > 0 ? "+" : "") + g + ')' : '') + '</span></div>' +
          '<div class="nr-res-track"><div class="nr-res-fill" style="width:' + c + '%;background:' + NR.score.zoneColor(z) + '"></div></div></div>';
      }).join("") + '</div></div>';
  }

  // milestones
  var earned = NR.store.getMilestones();
  var earnedTypes = {}; earned.forEach(function (x) { earnedTypes[x.type] = 1; });
  var lockedAll = NR.milestones.CATALOG.filter(function (d) { return !earnedTypes[d.type]; });
  var lockedShown = member ? lockedAll : lockedAll.slice(0, 2);
  var milestones = '<div class="nr-card nr-section"><div class="nr-head-row"><h2 style="margin:0">Milestones</h2><span class="muted" style="font-size:13px">' + earned.length + ' earned</span></div><div class="nr-milestones" style="margin-top:14px">' +
    (earned.length ? earned.map(function (x) { return '<span class="nr-chip"><span class="s">✦</span>' + NR.ui.esc(x.label) + '</span>'; }).join("") : '<span class="muted">None yet — your first check-in earns one.</span>') +
    lockedShown.map(function (d) { return '<span class="nr-chip locked"><span class="s">○</span>' + NR.ui.esc(d.label) + '</span>'; }).join("") +
    (!member && lockedAll.length > 2 ? '<span class="nr-chip locked">+' + (lockedAll.length - 2) + ' more</span>' : "") + '</div></div>';

  // stage progression
  var stageProg = '<div class="nr-card nr-section"><h2>Your stage</h2>' +
    '<div style="margin-top:10px">' + NR.ui.stagePill(cur.overall) + '</div>' +
    '<div class="nr-ladder" style="margin-top:14px">' + NR.stage.STAGES.map(function (s, i) { return '<div class="rung" style="background:' + (i <= NR.stage.indexFor(cur.overall) ? s.color : "rgba(255,255,255,.08)") + '"></div>'; }).join("") + '</div>' +
    '<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--slate);margin-top:6px">' + NR.stage.STAGES.map(function (s) { return '<span>' + s.name.split(" ")[0] + '</span>'; }).join("") + '</div></div>';

  var gateCard = (gateHist && hidden > 0)
    ? '<div class="nr-card gold nr-section" style="text-align:center"><div class="nr-lock">◈ Membership</div><h2 style="margin:6px 0">You have ' + hidden + ' earlier check-in' + (hidden === 1 ? "" : "s") + ' hidden</h2><p style="margin:0 auto 14px;max-width:44ch">See your full climb line, every reservoir change, and your complete milestone history with a membership.</p><a class="nr-btn" href="' + NR.config.routes.membership + '">See membership</a></div>'
    : "";

  app.innerHTML =
    '<div class="nr-crumbs"><a href="' + NR.config.routes.home + '">Mountain</a> / Progress</div>' +
    '<div class="nr-eyebrow">Progress</div><h1>Are you climbing?</h1>' +
    '<div class="nr-card pad-lg nr-section"><div class="k">This month’s report</div>' + reportBody + '</div>' +
    '<div class="nr-card nr-section"><div class="nr-head-row"><h2 style="margin:0">Your climb</h2><a class="nr-textlink" href="/progress-tracker">Project ahead →</a></div><div style="margin-top:14px">' + chart(visible) + '</div></div>' +
    gateCard + resChanges + stageProg + milestones +
    '<div class="nr-btn-row"><a class="nr-btn" href="' + NR.config.routes.checkin + '">Update my Mountain</a><a class="nr-btn ghost" href="' + NR.config.routes.home + '">Back to my Mountain</a></div>';
})();
</script>
</body>
</html>
