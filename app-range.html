<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0Z24386PQN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-0Z24386PQN');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>My Mountain Range · NorthReserve Mountain</title>
<meta name="description" content="Pursue multiple financial peaks: Emergency Ready, Debt Free, Home Ready, Retirement Ready, and more.">
<meta name="theme-color" content="#0A2A2E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nr-app.css">
  <script src="https://my-portfolio-intelligence.netlify.app/sdk/pi.js" data-pi-project="northreserve" defer></script>
</head>
<body class="nr">
<main class="nr-main"><div class="nr-wrap" id="app"></div></main>
<script src="/nr-config.js"></script>
<script src="/links.js"></script>
<script src="/nr-core.js"></script>
<script src="/nr-ui.js"></script>
<script src="/nr-auth.js"></script>
<script src="/nr-store-supabase.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var m = NR.store.loadMountain();
  if (!m) {
    NR.ui.boot({ active: "range", route: "range_empty" });
    app.innerHTML = '<div class="nr-card pad-lg" style="text-align:center"><div class="nr-empty"><div class="big">❖</div><h1>Your Mountain Range</h1><p style="margin:0 auto 18px;max-width:42ch">Several peaks, one mountain. Build your Mountain first and we’ll map your route to each.</p><a class="nr-btn" href="' + NR.config.routes.assessment + '">Take the assessment</a></div></div>';
    return;
  }
  NR.ui.boot({ active: "range", route: "range" });
  NR.track("range_viewed", { score: m.overall });

  var member = NR.membership.isMember();

  function syncCompletions() {
    var peaks = NR.store.getMountainRange(), goals = NR.store.getGoals();
    goals.forEach(function (g) {
      var p = peaks.filter(function (x) { return x.type === g.type; })[0];
      if (p && p.progress >= 100 && g.status !== "complete") { g.status = "complete"; NR.store.saveGoal(g); NR.track("goal_completed", { goal_type: g.type }); }
      if (p && p.progress < 100 && g.status === "complete") { g.status = "active"; NR.store.saveGoal(g); }
    });
  }

  function peakCard(p, locked) {
    var goals = NR.store.getGoals(), tracked = goals.some(function (g) { return g.type === p.type; });
    var fill = p.status === "complete" ? "#1D9E6E" : "var(--gold)";
    var trackBtn = locked ? "" :
      '<button class="nr-btn ' + (tracked ? "subtle" : "ghost") + ' sm" data-track="' + p.type + '">' + (tracked ? "✓ Tracking" : "Track this peak") + '</button>';
    var tool = '<a class="nr-btn ghost sm" href="' + p.tool.url + '">' + NR.ui.esc(p.tool.name) + '</a>';
    return '<div class="nr-peak">' +
      '<div class="nr-peak-head"><span class="nr-peak-ic">' + p.icon + '</span><span class="nr-peak-ttl">' + NR.ui.esc(p.label) + '</span><span class="nr-peak-pct">' + p.progress + '%</span></div>' +
      '<div class="nr-peak-bar"><div class="nr-peak-fill" style="width:' + p.progress + '%;background:' + fill + '"></div></div>' +
      '<p style="font-size:13.5px;margin:0 0 10px">' + NR.ui.esc(p.blurb) + '</p>' +
      '<div class="nr-peak-cp"><span class="k">Next checkpoint</span>' + NR.ui.esc(p.checkpoint) + '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap"><span class="nr-badge ' + p.status + '">' + p.status.replace("-", " ") + '</span></div>' +
      (p.cross ? NR.ui.crossGraph(p.cross) : "") +
      '<div class="nr-btn-row" style="margin-top:12px">' + tool + " " + trackBtn + '</div>' +
      '</div>';
  }

  function render() {
    syncCompletions();
    var peaks = NR.store.getMountainRange();
    var goals = NR.store.getGoals();
    var complete = peaks.filter(function (p) { return p.progress >= 100; }).length;

    var body;
    if (member || !NR.config.gates.mountainRange) {
      body = '<div class="nr-grid nr-grid-2">' + peaks.map(function (p) { return peakCard(p, false); }).join("") + '</div>';
    } else {
      var primary = NR.range.primary(m);
      var others = peaks.filter(function (p) { return p.type !== primary.type; });
      body = '<div class="nr-eyebrow">Your suggested peak</div>' + peakCard(primary, false) +
        '<div class="nr-gate nr-section"><div class="nr-grid nr-grid-2" style="filter:blur(3px);opacity:.5;pointer-events:none">' +
        others.slice(0, 4).map(function (p) { return peakCard(p, true); }).join("") + '</div>' +
        NR.ui.gateVeil({ title: "Pursue your whole Mountain Range", body: "Track Emergency Ready, Debt Free, Home Ready, Retirement Ready, Investment Ready and Financial Independence — together." }) + '</div>';
    }

    app.innerHTML =
      '<div class="nr-crumbs"><a href="' + NR.config.routes.home + '">Mountain</a> / Mountain Range</div>' +
      '<div class="nr-head-row"><div><div class="nr-eyebrow">My Mountain Range</div><h1 style="margin:0">Several peaks, one mountain</h1></div>' +
      '<span class="nr-badge on-track">' + complete + ' / ' + peaks.length + ' summited</span></div>' +
      '<p class="nr-lead" style="margin-top:10px">Each peak draws from the same reservoirs — so every check-in moves several at once. Build strength before chasing the summit.</p>' +
      '<div class="nr-section">' + body + '</div>' +
      (member ? "" : '<p class="muted" style="font-size:13px;margin-top:18px">Tracking is limited to one peak on the free plan.</p>');

    [].forEach.call(app.querySelectorAll("[data-track]"), function (b) {
      b.addEventListener("click", function () {
        var type = b.getAttribute("data-track"), g = NR.store.getGoals(), has = g.some(function (x) { return x.type === type; });
        if (has) { NR.store.deleteGoal(type); }
        else {
          if (!member && NR.store.getGoals().length >= NR.config.freeGoalLimit) { NR.ui.toast("Tracking more than one peak is a membership feature."); return; }
          var peak = NR.store.getMountainRange().filter(function (x) { return x.type === type; })[0];
          NR.store.saveGoal({ type: type, label: peak.label });
          NR.track("goal_created", { goal_type: type });
          NR.ui.toast("Tracking " + peak.label + ".");
        }
        render();
      });
    });
    [].forEach.call(app.querySelectorAll("[data-xg]"), function (x) { x.addEventListener("click", function () { NR.track("cross_graph_route_clicked", { route: x.getAttribute("data-xg") }); }); });
  }
  render();
})();
</script>
</body>
</html>
