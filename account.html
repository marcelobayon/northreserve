<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0Z24386PQN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-0Z24386PQN');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Account · NorthReserve Mountain</title>
<meta name="description" content="Your NorthReserve Mountain account — profile, membership, and your data.">
<meta name="theme-color" content="#0A2A2E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nr-app.css">
  <script src="https://my-portfolio-intelligence.netlify.app/sdk/pi.js" data-pi-project="northreserve" defer></script>
</head>
<body class="nr">
<main class="nr-main"><div class="nr-narrow" id="app"></div></main>
<script src="/nr-config.js"></script>
<script src="/links.js"></script>
<script src="/nr-core.js"></script>
<script src="/nr-ui.js"></script>
<script src="/nr-auth.js"></script>
<script src="/nr-store-supabase.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  NR.ui.boot({ active: null, route: "account" });

  function render() {
    var p = NR.account.get(), m = NR.store.loadMountain();
    var authHtml = (NR.auth && NR.auth.renderCard) ? NR.auth.renderCard() : "";

    if (!p || !p.id) {
      app.innerHTML =
        '<div class="nr-eyebrow">Account</div><h1>Save your climb</h1>' + authHtml +
        '<div class="nr-card pad-lg nr-section" style="text-align:center">' +
        (m
          ? '<p style="margin:0 auto 18px;max-width:42ch">You’ve built your Mountain. Save it to keep it, check in monthly, and track your progress — free.</p><button class="nr-btn" id="save">Save my Mountain</button>'
          : '<p style="margin:0 auto 18px;max-width:42ch">Take the quick assessment first — then you can save your Mountain and create a free account.</p><a class="nr-btn" href="' + NR.config.routes.assessment + '">Take the assessment</a>') +
        '<div class="nr-privacy" style="justify-content:center"><span class="s">◈</span> No password needed. No bank linking. Your data stays on your device.</div></div>';
      if (NR.auth && NR.auth.bind) NR.auth.bind();
      var sv = document.getElementById("save");
      if (sv) sv.addEventListener("click", function () { NR.store.adoptCurrent(); NR.track("mountain_saved", { score: m.overall, source: "account" }); NR.ui.toast("Saved. Welcome to the climb."); render(); });
      return;
    }

    var isMember = NR.membership.isMember();
    app.innerHTML =
      '<div class="nr-crumbs"><a href="' + NR.config.routes.home + '">Mountain</a> / Account</div>' +
      '<div class="nr-eyebrow">Account</div><h1>Your account</h1>' + authHtml +

      '<div class="nr-card nr-section"><h2>Profile</h2>' +
        '<div class="nr-field" style="margin-top:14px"><label class="nr-label" for="dn">Display name</label>' +
        '<input class="nr-input" id="dn" value="' + NR.ui.esc(p.displayName || "") + '" placeholder="What should we call you?"></div>' +
        '<div class="nr-field"><label class="nr-label" for="em">Email (optional)</label>' +
        '<input class="nr-input" id="em" type="email" value="' + NR.ui.esc(p.email || "") + '" placeholder="you@example.com">' +
        '<div class="nr-help">Saved on your device only. We don’t email you yet — this is here for future cross-device sync.</div></div>' +
        '<button class="nr-btn sm" id="savep">Save profile</button></div>' +

      '<div class="nr-card nr-section"><div class="nr-head-row"><h2 style="margin:0">Membership</h2><span class="nr-badge ' + (isMember ? "on-track" : "early") + '">' + (isMember ? "Member" : "Free") + '</span></div>' +
        '<p style="margin:10px 0 0">' + (isMember ? "You have full access to history, your Mountain Range, and monthly reports." : "You’re on the free plan: see and save your Mountain, check in monthly, and get your one Next Move.") + '</p>' +
        '<div class="nr-btn-row"><a class="nr-btn ' + (isMember ? "ghost" : "") + ' sm" href="' + NR.config.routes.membership + '">' + (isMember ? "Manage membership" : "See membership") + '</a></div></div>' +

      '<div class="nr-card nr-section"><h2>Your data</h2>' +
        '<p style="margin:8px 0 0;font-size:14px">Everything lives in this browser. Copy your climb key to move to another device or keep a backup.</p>' +
        '<div class="nr-field" style="margin-top:14px"><label class="nr-label">Your climb key</label>' +
        '<textarea class="nr-input" id="expkey" readonly></textarea>' +
        '<div class="nr-btn-row" style="margin-top:10px"><button class="nr-btn subtle sm" id="copy">Copy key</button></div></div>' +
        '<div class="nr-field"><label class="nr-label" for="impkey">Restore from a key</label>' +
        '<textarea class="nr-input" id="impkey" placeholder="Paste a climb key here"></textarea>' +
        '<div class="nr-btn-row" style="margin-top:10px"><button class="nr-btn ghost sm" id="imp">Restore</button></div></div></div>' +

      '<div class="nr-card nr-section" style="border-color:rgba(226,85,61,.3)"><h2>Danger zone</h2>' +
        '<p style="margin:8px 0 14px;font-size:14px">Erase your saved Mountain, history, goals, and account from this browser. This can’t be undone.</p>' +
        '<button class="nr-btn danger" id="reset">Erase my data</button></div>';

    document.getElementById("expkey").value = NR.account.exportKey();
    if (NR.auth && NR.auth.bind) NR.auth.bind();
    document.getElementById("savep").addEventListener("click", function () {
      NR.account.update({ displayName: document.getElementById("dn").value.trim(), email: document.getElementById("em").value.trim() });
      NR.ui.toast("Profile saved."); render();
    });
    document.getElementById("copy").addEventListener("click", function () {
      var t = document.getElementById("expkey"); t.select();
      try { navigator.clipboard.writeText(t.value); } catch (e) { try { document.execCommand("copy"); } catch (e2) {} }
      NR.ui.toast("Climb key copied.");
    });
    document.getElementById("imp").addEventListener("click", function () {
      var v = document.getElementById("impkey").value.trim(); if (!v) return;
      if (NR.account.importKey(v)) { NR.ui.toast("Restored. Welcome back."); render(); } else { NR.ui.toast("That key couldn’t be read."); }
    });
    var rb = document.getElementById("reset"), armed = false;
    rb.addEventListener("click", function () {
      if (!armed) { armed = true; rb.textContent = "Tap again to erase everything"; setTimeout(function () { armed = false; rb.textContent = "Erase my data"; }, 4000); return; }
      NR.account.reset(); NR.ui.toast("Your data was erased."); render();
    });
  }
  render();
})();
</script>
</body>
</html>
