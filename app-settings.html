<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0Z24386PQN"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Settings · NorthReserve Mountain</title>
<meta name="description" content="NorthReserve Mountain settings — privacy, install, analytics, and your data.">
<meta name="theme-color" content="#0A2A2E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nr-app.css">
  <script src="https://my-portfolio-intelligence.netlify.app/sdk/pi.js" data-pi-project="northreserve" defer></script>
</head>
<body class="nr">
<main class="nr-main"><div class="nr-narrow" id="app"></div></main>
<script src="/nr-config.js"></script>
<script src="/links.js"></script>
<script src="/nr-core.js"></script>
<script src="/nr-ui.js"></script>
<script src="/nr-auth.js"></script>
<script src="/nr-store-supabase.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  NR.ui.boot({ active: null, route: "settings" });
  var settings = NR.store.driver.getSettings();

  app.innerHTML =
    '<div class="nr-crumbs"><a href="' + NR.config.routes.home + '">Mountain</a> / Settings</div>' +
    '<div class="nr-eyebrow">Settings</div><h1>Settings</h1>' +

    '<div class="nr-card nr-section"><h2>Privacy</h2>' +
      '<p style="margin-top:8px;font-size:14.5px">NorthReserve is built privacy-first. You answer in <b class="snow">ranges</b>, never account numbers. We never ask for bank logins and never connect to your accounts. Your Mountain, history, and goals are stored <b class="snow">in this browser</b> — not on our servers.</p>' +
      '<div class="nr-privacy"><span class="s">◈</span> Read the full <a class="nr-link" href="/privacy">privacy policy</a>.</div></div>' +

    '<div class="nr-card nr-section"><h2>Install the app</h2>' +
      '<p style="margin:8px 0 0;font-size:14.5px">Add NorthReserve Mountain to your home screen for one-tap monthly check-ins. No app store needed.</p>' +
      '<div class="nr-btn-row"><button class="nr-btn sm" id="install">Install</button></div>' +
      '<div class="nr-help" id="installHint">If the button does nothing, use your browser menu: “Add to Home Screen” (iOS Safari) or “Install” (Chrome).</div></div>' +

    '<div class="nr-card nr-section"><h2>Analytics</h2>' +
      '<div class="nr-toggle" style="border-top:none;padding-top:6px"><div><div class="snow" style="font-weight:600">Share anonymous usage</div>' +
      '<div class="nr-help" style="margin-top:2px">Helps improve NorthReserve. We only ever send score bands and labels — never your numbers or email.</div></div>' +
      '<label style="flex:none"><input type="checkbox" id="opt" style="width:20px;height:20px;accent-color:#F2B441" ' + (settings.analyticsOptOut ? "" : "checked") + '></label></div></div>' +

    '<div class="nr-card nr-section"><h2>Your data</h2>' +
      '<p style="margin:8px 0 14px;font-size:14.5px">Back up, move devices, or erase everything from your account.</p>' +
      '<div class="nr-btn-row"><a class="nr-btn ghost sm" href="' + NR.config.routes.account + '">Manage data &amp; account</a></div></div>' +

    '<div class="nr-card nr-section"><h2>About</h2>' +
      '<p style="margin:8px 0 0;font-size:14px">NorthReserve Mountain · v' + NR.ui.esc(NR.version) + '<br>Educational tools, not financial advice. NorthReserve does not manage your money or your accounts.</p>' +
      '<div class="nr-privacy"><span class="s">✦</span> <a class="nr-link" href="/">NorthReserve.org</a></div></div>';

  var ib = document.getElementById("install");
  ib.addEventListener("click", function () { if (NR.ui.canInstall()) NR.ui.promptInstall(); else NR.ui.toast("Use your browser’s “Add to Home Screen” option."); });
  document.getElementById("opt").addEventListener("change", function (e) {
    var s = NR.store.driver.getSettings(); s.analyticsOptOut = !e.target.checked; NR.store.driver.setSettings(s);
    NR.ui.toast(e.target.checked ? "Thanks — anonymous usage on." : "Analytics off on this device.");
  });
})();
</script>
</body>
</html>
